<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    a { color: #7fb4e8; } a:hover { color: #a9cdf1; }
  </style>
</helmet>
<div style="width: 480px; height: 620px; background: #14161a; color: #e8e9ec; padding: 24px; display: flex; flex-direction: column; gap: 16px;">

    <div style="width: 90px; height: 18px; background: #2a2e36; border-radius: 4px;"></div>

    <div style="width: 150px; height: 14px; background: #2a2e36; border-radius: 4px;"></div>
    <div style="font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; color: #ffffff;">327 €<span style="font-size: 16px; color: #8a8f99;">/mo</span></div>
    <div style="display: flex; gap: 2px; height: 12px;">
      <div style="width: 54%; background: #3987e5; border-radius: 4px 0 0 4px;"></div>
      <div style="width: 12%; background: #199e70;"></div>
      <div style="width: 20%; background: #c98500;"></div>
      <div style="width: 14%; background: #008300; border-radius: 0 4px 4px 0;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="width: 70px; height: 12px; background: #2a2e36; border-radius: 4px;"></div>
      <div style="width: 70px; height: 12px; background: #2a2e36; border-radius: 4px;"></div>
      <div style="width: 70px; height: 12px; background: #2a2e36; border-radius: 4px;"></div>
    </div>
  </div>
  <div style="border: 1px dashed #3a3f48; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="width: 150px; height: 14px; background: #2a2e36; border-radius: 4px;"></div>
    <div style="font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; color: #ffffff;">522 €<span style="font-size: 16px; color: #8a8f99;">/mo</span></div>
    <div style="display: flex; gap: 2px; height: 12px;">
      <div style="width: 34%; background: #3987e5; border-radius: 4px 0 0 4px;"></div>
      <div style="width: 13%; background: #d95926;"></div>
      <div style="width: 27%; background: #199e70;"></div>
      <div style="width: 26%; background: #c98500; border-radius: 0 4px 4px 0;"></div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="width: 70px; height: 12px; background: #2a2e36; border-radius: 4px;"></div>
      <div style="width: 70px; height: 12px; background: #2a2e36; border-radius: 4px;"></div>
    </div>
  </div>
  <div style="margin-top: auto; font-size: 13px; color: #8a8f99; line-height: 1.5;">
    Dark, instrument-panel feel. Numbers glow, chrome recedes. Good in a dim showroom; heavier to keep readable in daylight.
  </div>
</div>

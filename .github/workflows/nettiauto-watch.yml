name: Nettiauto watch

# Checks nettiauto for new listings matching the filters and posts anything new
# to Discord. The filters come from the app's gist (created in the calculator's
# UI) when GIST_TOKEN is set, and from the committed scraper/filters.json
# otherwise. Independent of the Pages deploy workflow - it touches nothing the
# frontend build uses.

on:
  schedule:
    # Ask for twelve an hour; the run itself decides which of them crawls.
    #
    # GitHub runs schedules on best-effort shared capacity and drops firings
    # under load - heavily. Measured over four days on '7,37': **17 runs against
    # an expected 185**, a 9 % hit rate, median gap 5.7 hours, worst gap 12.5.
    # None of the misses were ours - no cancelled runs, every run under three
    # minutes - so moving off :00/:30 was not the fix it looked like.
    #
    # So ask for far more than we want and throttle in the watcher instead
    # (fetch.minIntervalMinutes, default 25). Taking all twelve would be six
    # times the load on a site that owes us nothing; asking for twelve and
    # crawling at most twice an hour converges on the rate we intend, whatever
    # GitHub delivers - and self-corrects if their scheduler improves.
    #
    # Every minute is off the quarter-hours, the most oversubscribed of all.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report, but post nothing and save no state'
        type: boolean
        default: false
      seed:
        description: 'Re-record everything currently on sale without posting'
        type: boolean
        default: false

# The state file is committed back after each run, so runs must not overlap.
concurrency:
  group: nettiauto-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # A normal run takes ~2 minutes and the slowest seen was 7. Without a
    # ceiling, a run wedged on an unresponsive nettiauto holds the concurrency
    # group for GitHub's default six hours and every schedule behind it is
    # dropped - one stuck run costs a whole morning of checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for new listings
        working-directory: scraper
        env:
          # Every secret is named, never `SECRETS_JSON: ${{ toJSON(secrets) }}`.
          #
          # The whole set in one variable made onboarding commit-free, but
          # dumping every secret into a step is what exfiltration looks like:
          # from 2026-08-30 GitHub held each scheduled run as "this workflow
          # file may be malicious" (conclusion action_required, no jobs), and
          # the watcher sat silent for a week with nothing failing.
          #
          # So adding somebody is two secrets in the settings UI plus their two
          # lines here (src/tenants.js reads plain variables just the same):
          #
          #   TENANT_<NAME>_GIST_TOKEN: ${{ secrets.TENANT_<NAME>_GIST_TOKEN }}
          #   TENANT_<NAME>_WEBHOOK:    ${{ secrets.TENANT_<NAME>_WEBHOOK }}
          #
          # GIST_TOKEN does double duty: reading the filters made in the app,
          # and half of the reaction pickup. DISCORD_BOT_TOKEN is shared - one
          # bot reads every channel in every server it has been invited to.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node src/index.js \
            --notify-errors \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.seed && '--seed' || '' }}

      - name: Remember what was found
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- scraper/data/seen.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scraper/data/seen.json
          git commit -m 'chore(scraper): update seen listings'
          # Another scheduled run may have pushed while this one was working.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto origin (attempt $attempt)..."
            git pull --rebase --autostash || true
          done
          echo "Could not push the state file after 3 attempts." >&2
          exit 1

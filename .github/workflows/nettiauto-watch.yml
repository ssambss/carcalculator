name: Nettiauto watch

# Checks nettiauto for new listings matching the filters and posts anything new
# to Discord. The filters come from the app's gist (created in the calculator's
# UI) when GIST_TOKEN is set, and from the committed scraper/filters.json
# otherwise. Independent of the Pages deploy workflow - it touches nothing the
# frontend build uses.

on:
  schedule:
    # Every 30 minutes, deliberately offset off :00/:30. GitHub runs schedules
    # on best-effort shared capacity and silently drops firings under load, and
    # the top and half of the hour are the most oversubscribed minutes of all -
    # on '*/30' this job was losing roughly nine firings in ten. Drift is still
    # fine, the scraper is idempotent; never firing at all is not.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report, but post nothing and save no state'
        type: boolean
        default: false
      seed:
        description: 'Re-record everything currently on sale without posting'
        type: boolean
        default: false

# The state file is committed back after each run, so runs must not overlap.
concurrency:
  group: nettiauto-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # A normal run takes ~2 minutes and the slowest seen was 7. Without a
    # ceiling, a run wedged on an unresponsive nettiauto holds the concurrency
    # group for GitHub's default six hours and every schedule behind it is
    # dropped - one stuck run costs a whole morning of checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for new listings
        working-directory: scraper
        env:
          # The whole secret set, in one variable, parsed by src/tenants.js.
          #
          # Actions only puts a secret in the environment if the workflow names
          # it, so naming them individually would mean editing this file - and
          # committing - every time somebody is added. This way onboarding is
          # two secrets in the settings UI and nothing else:
          #
          #   TENANT_<NAME>_GIST_TOKEN   their gist token
          #   TENANT_<NAME>_WEBHOOK      the webhook for their channel
          #   TENANT_<NAME>_LABEL        optional, for names a secret cannot spell
          #
          # Your own stay as DISCORD_WEBHOOK_URL and GIST_TOKEN. GIST_TOKEN does
          # double duty: reading the filters made in the app, and half of the
          # reaction pickup. DISCORD_BOT_TOKEN is shared - one bot reads every
          # channel in the server.
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          node src/index.js \
            --notify-errors \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.seed && '--seed' || '' }}

      - name: Remember what was found
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- scraper/data/seen.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scraper/data/seen.json
          git commit -m 'chore(scraper): update seen listings'
          # Another scheduled run may have pushed while this one was working.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto origin (attempt $attempt)..."
            git pull --rebase --autostash || true
          done
          echo "Could not push the state file after 3 attempts." >&2
          exit 1
